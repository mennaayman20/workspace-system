@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm dir-rtl">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-xl w-full max-w-lg overflow-hidden animate-in fade-in zoom-in duration-150">
      
      <!-- Dynamic Modal Header -->
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
        <h2 class="text-base font-bold text-slate-800">
          {{ selectedWorkspace ? 'تعديل مساحة العمل' : 'إضافة مساحة عمل جديدة' }}
        </h2>
        <button (click)="onClose()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
      </div>

      <!-- Modal Form Body -->
      <form [formGroup]="workspaceForm" (ngSubmit)="onSubmit()" class="p-6 space-y-4">
        
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">اسم المساحة <span class="text-rose-500">*</span></label>
          <input 
            type="text" 
            formControlName="name"
            placeholder="مثال: Meeting Room 03"
            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:border-blue-500 focus:outline-none transition-all"
          />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">نوع المساحة <span class="text-rose-500">*</span></label>
            <select 
              formControlName="type"
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:border-blue-500 focus:outline-none transition-all">
              @for (type of workspaceTypes; track type) {
                <option [value]="type">{{ type }}</option>
              }
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">السعة <span class="text-rose-500">*</span></label>
            <input 
              type="number" 
              formControlName="capacity"
              min="1"
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:border-blue-500 focus:outline-none transition-all"
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">الموقع / الدور <span class="text-rose-500">*</span></label>
          <input 
            type="text" 
            formControlName="location"
            placeholder="مثال: الدور الأول"
            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:border-blue-500 focus:outline-none transition-all"
          />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">الوصف (اختياري)</label>
          <textarea 
            formControlName="description"
            rows="2"
            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:border-blue-500 focus:outline-none transition-all resize-none"
          ></textarea>
        </div>

        <!-- Dynamic Footer Button -->
        <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
          <button 
            type="button" 
            (click)="onClose()"
            class="px-4 py-2.5 rounded-xl border border-slate-200 text-xs font-medium text-slate-600 hover:bg-slate-50 transition-all">
            إلغاء
          </button>
          
          <button 
            type="submit" 
            [disabled]="isSubmitting"
            class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shadow-sm transition-all disabled:opacity-50">
            @if (isSubmitting) {
              <span>جاري الحفظ...</span>
            } @else {
              <span>{{ selectedWorkspace ? 'تعديل التغييرات' : 'حفظ المساحة' }}</span>
            }
          </button>
        </div>

      </form>

    </div>
  </div>
}
