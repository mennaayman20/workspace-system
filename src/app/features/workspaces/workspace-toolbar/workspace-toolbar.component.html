<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 bg-white p-2.5 sm:p-3 rounded-xl border border-slate-200/80 shadow-xs fade-up">
  <!-- Search -->
  <div class="relative flex-1 max-w-xs">
    <svg class="w-4 h-4 text-slate-400 absolute top-1/2 -translate-y-1/2 right-3 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path stroke-linecap="round" d="m20 20-3.5-3.5"/></svg>
    <input
      type="search"
      [value]="searchTerm()"
      (input)="searchChange.emit($any($event.target).value)"
      placeholder="ابحث بالاسم، الكود، الطابق..."
      class="w-full pr-9 pl-3 py-1.5 bg-slate-50 border border-slate-200/90 rounded-lg text-xs placeholder:text-slate-400 focus:bg-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all" />
  </div>

  <!-- Filter Pills -->
  <div class="flex items-center gap-1 overflow-x-auto pb-0.5 sm:pb-0 scrollbar-none">
    <button type="button" (click)="statusChange.emit('all')"
      [class]="statusFilter() === 'all' ? 'bg-slate-900 text-white shadow-xs' : 'bg-slate-100/80 text-slate-600 hover:bg-slate-200/70'"
      class="px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all whitespace-nowrap flex items-center gap-1.5">
      <span>الكل</span>
      <span class="px-1.5 py-0.2 rounded-md text-[10px] font-extrabold" 
            [class]="statusFilter() === 'all' ? 'bg-white/20 text-white' : 'bg-slate-200/80 text-slate-700'">
        {{ statusCounts()['all'] || 0 }}
      </span>
    </button>

    @for (s of statusOptions(); track s.value) {
      <button type="button" (click)="statusChange.emit(s.value)"
        [class]="statusFilter() === s.value ? 'bg-blue-600 text-white shadow-xs' : 'bg-slate-100/80 text-slate-600 hover:bg-slate-200/70'"
        class="px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all whitespace-nowrap flex items-center gap-1.5">
        <span>{{ s.label }}</span>
        <span class="px-1.5 py-0.2 rounded-md text-[10px] font-extrabold" 
              [class]="statusFilter() === s.value ? 'bg-white/20 text-white' : 'bg-slate-200/80 text-slate-700'">
          {{ statusCounts()[s.value] || 0 }}
        </span>
      </button>
    }
  </div>
</div>
