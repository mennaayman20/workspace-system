<form [formGroup]="form" (ngSubmit)="submit()" class="p-6 space-y-5">
  <div>
    <h2 class="text-lg font-extrabold text-slate-900">
      {{ isEdit ? 'تعديل الخطة' : 'إضافة خطة تسعير' }}
    </h2>
    <p class="text-sm text-slate-500 mt-1">
      {{ isEdit ? 'عدّل بيانات الخطة الأساسية.' : 'بعد الحفظ ستنتقل لتحديد أسعار أنواع المساحات.' }}
    </p>
  </div>

  <!-- الاسم -->
  <div>
    <label for="plan-name" class="block text-sm font-bold text-slate-700 mb-1.5">
      اسم الخطة <span class="text-rose-500">*</span>
    </label>
    <input
      id="plan-name"
      type="text"
      formControlName="name"
      maxlength="100"
      placeholder="مثال: Standard Plan"
      class="w-full h-11 px-3 bg-white border border-slate-200 rounded-xl text-sm placeholder:text-slate-400 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition-all" />
    
    @if (form.controls.name.touched && form.controls.name.invalid) {
      <p class="text-xs text-rose-600 mt-1.5">اسم الخطة مطلوب (بحد أقصى 100 حرف)</p>
    }
  </div>

  <!-- الوصف -->
  <div>
    <label for="plan-description" class="block text-sm font-bold text-slate-700 mb-1.5">الوصف</label>
    <textarea
      id="plan-description"
      formControlName="description"
      rows="3"
      maxlength="500"
      placeholder="مثال: أسعار الزبائن العاديين"
      class="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-xl text-sm placeholder:text-slate-400 resize-none focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 transition-all"></textarea>
  </div>

  <!-- الحالة -->
  <label class="flex items-center gap-3 cursor-pointer select-none">
    <input type="checkbox" formControlName="isActive" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500" />
    <span class="text-sm font-semibold text-slate-700">خطة نشطة (تظهر عند اختيار خطة لعميل)</span>
  </label>

  @if (errorMessage()) {
    <div role="alert" class="p-3 bg-rose-50 border border-rose-200 text-rose-700 text-sm rounded-xl">
      {{ errorMessage() }}
    </div>
  }

  <div class="flex items-center justify-end gap-2 pt-2">
    <button 
      type="button" 
      (click)="cancel()" 
      [disabled]="isSaving()"
      class="px-5 h-11 border border-slate-200 hover:bg-slate-50 disabled:opacity-50 rounded-xl text-sm font-bold text-slate-600 transition-colors">
      إلغاء
    </button>
    <button 
      type="submit" 
      [disabled]="isSaving()"
      class="px-6 h-11 bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white rounded-xl text-sm font-bold transition-colors">
      {{ isSaving() ? 'جارٍ الحفظ...' : isEdit ? 'حفظ التعديلات' : 'إنشاء الخطة' }}
    </button>
  </div>
</form>
