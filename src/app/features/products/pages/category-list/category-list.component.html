<style>
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fadeUp .35s ease-out both; }
  @media (prefers-reduced-motion: reduce) { .fade-up { animation: none; } }
</style>

<div class="w-full mb-6">
  <div class="max-w-7xl mx-auto px-1 sm:px-2">
    <nav class="inline-flex items-center gap-1.5 p-1.5 bg-slate-200/40 backdrop-blur-md rounded-2xl border border-slate-200/60 overflow-x-auto no-scrollbar" aria-label="Tabs">

      <a [routerLink]="['/products/list']"
         routerLinkActive="bg-white text-blue-600 shadow-sm border-slate-200/80 font-bold"
         [routerLinkActiveOptions]="{ exact: true }"
         class="group inline-flex items-center gap-2 px-4 py-2 rounded-xl text-xs sm:text-sm font-medium text-slate-600 hover:text-slate-900 border border-transparent transition-all duration-200 shrink-0 cursor-pointer select-none">
        <lucide-icon [img]="PackageIcon" class="w-4 h-4 text-slate-400 group-[.font-bold]:text-blue-600 transition-colors"></lucide-icon>
        <span>قائمة المنتجات</span>
      </a>

      <a [routerLink]="['/products/categories']"
         routerLinkActive="bg-white text-blue-600 shadow-sm border-slate-200/80 font-bold"
         class="group inline-flex items-center gap-2 px-4 py-2 rounded-xl text-xs sm:text-sm font-medium text-slate-600 hover:text-slate-900 border border-transparent transition-all duration-200 shrink-0 cursor-pointer select-none">
        <lucide-icon [img]="FolderTreeIcon" class="w-4 h-4 text-slate-400 group-[.font-bold]:text-blue-600 transition-colors"></lucide-icon>
        <span>تصنيفات المنتجات</span>
      </a>

    </nav>
  </div>
</div>

<div dir="rtl" class="p-4 sm:p-8 space-y-6 sm:space-y-8 max-w-7xl mx-auto">

  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 fade-up">
    <div class="flex items-center gap-4">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-700 text-white flex items-center justify-center shadow-lg shadow-blue-500/20 shrink-0">
        <lucide-icon [img]="FolderTreeIcon" class="w-6 h-6"></lucide-icon>
      </div>
      <div>
        <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight">إدارة التصنيفات</h1>
        <p class="text-sm text-slate-500 mt-1">إضافة، تعديل وإدارة تصنيفات المنتجات بالنظام</p>
      </div>
    </div>

    <button type="button" (click)="openAddForm()"
      class="inline-flex items-center justify-center gap-2 px-5 py-3 bg-gradient-to-r from-blue-500 to-blue-700 text-white rounded-xl text-sm font-bold shadow-lg shadow-blue-500/25 hover:shadow-blue-500/40 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 shrink-0">
      <lucide-icon [img]="PlusIcon" class="w-4 h-4"></lucide-icon>
      <span>إضافة تصنيف جديد</span>
    </button>
  </div>

  <!-- الجدول المشترك (بحث لكل عمود + ترتيب + pagination) -->
  <app-data-table
    [value]="categoryService.categories()"
    [columns]="columns"
    [actions]="actions"
    [columnFilters]="true"
    [minWidth]="'48rem'"
    [emptyTitle]="categoryService.categories().length === 0 ? 'لا توجد تصنيفات مضافة حتى الآن' : 'لا توجد نتائج مطابقة'"
    (action)="onAction($event)">

    @if (categoryService.categories().length === 0) {
      <button tableEmptyAction type="button" (click)="openAddForm()"
        class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-bold transition-colors">
        + أضف أول تصنيف
      </button>
    }
  </app-data-table>

  <!-- مودال الإضافة والتعديل -->
  @if (isFormOpen()) {
    <app-category-form-modal
      [category]="editing()"
      (saved)="closeForm()"
      (closeModal)="closeForm()">
    </app-category-form-modal>
  }

  <!-- مودال تأكيد الحذف -->
  @if (pendingDelete(); as d) {
    <div class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4"
         (click)="cancelDelete()">
      <div class="w-full max-w-sm bg-white rounded-3xl p-6 shadow-2xl" dir="rtl"
           role="alertdialog" aria-modal="true" (click)="$event.stopPropagation()">

        <div class="flex items-start gap-3">
          <div class="w-11 h-11 rounded-2xl bg-red-50 text-red-500 flex items-center justify-center shrink-0">
            <lucide-icon [img]="TrashIcon" class="w-5 h-5"></lucide-icon>
          </div>
          <div>
            <h3 class="text-lg font-bold text-slate-900">حذف التصنيف</h3>
            <p class="text-sm text-slate-500 mt-1.5 leading-relaxed">
              هل أنت متأكد من حذف
              <b class="text-slate-800">"{{ displayName(d) }}"</b>؟
            </p>
          </div>
        </div>

        <div class="flex gap-3 mt-6">
          <button type="button" (click)="confirmDelete()" [disabled]="isDeleting()"
                  class="flex-1 py-2.5 bg-red-600 hover:bg-red-700 disabled:opacity-60 text-white rounded-xl text-sm font-bold transition-colors">
            {{ isDeleting() ? 'جاري الحذف...' : 'نعم، حذف' }}
          </button>
          <button type="button" (click)="cancelDelete()" [disabled]="isDeleting()"
                  class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 disabled:opacity-60 rounded-xl text-sm font-bold text-slate-700 transition-colors">
            إلغاء
          </button>
        </div>
      </div>
    </div>
  }
</div>
