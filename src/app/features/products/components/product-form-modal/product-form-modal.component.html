<div *ngIf="isOpen()" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm transition-opacity dir-rtl">
  
  <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-2xl overflow-hidden transform transition-all text-right">
    
    <!-- Modal Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100 bg-slate-50/50">
      <h3 class="text-lg font-bold text-slate-800">
        {{ productToEdit() ? 'تعديل المنتج' : 'إضافة منتج جديد' }}
      </h3>
      <button (click)="onClose()" class="text-slate-400 hover:text-slate-600 rounded-lg p-1 text-xl font-bold leading-none">
        &times;
      </button>
    </div>

    <!-- Modal Body / Form -->
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="p-6 space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        
        <!-- Category Dropdown -->
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-slate-700 mb-1">التصنيف (Category) *</label>
          <select formControlName="productCategoryId">
  <option [ngValue]="null" disabled>اختر التصنيف</option>
  @for (cat of categoryService.categories(); track cat.id) {
    <option [ngValue]="cat.id">{{ cat.name }}</option>
  }
</select>
        </div>

        <!-- English Name -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">اسم المنتج *</label>
          <input type="text" formControlName="englishName" class="w-full rounded-xl border border-slate-300 p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Product Name" />
        </div>

        <!-- SKU -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">رمز المنتج (SKU)</label>
          <input type="text" formControlName="sku" class="w-full rounded-xl border border-slate-300 p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="SKU-1001" />
        </div>

        <!-- Selling Price -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">سعر البيع *</label>
          <input type="number" formControlName="sellingPrice" class="w-full rounded-xl border border-slate-300 p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>

        <!-- Cost Price -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">سعر التكلفة *</label>
          <input type="number" formControlName="costPrice" class="w-full rounded-xl border border-slate-300 p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>

        <!-- Description -->
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-slate-700 mb-1">الوصف</label>
          <textarea formControlName="description" rows="2" class="w-full rounded-xl border border-slate-300 p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="وصف المنتج..."></textarea>
        </div>

        <!-- Active Toggle -->
        <div class="md:col-span-2 flex items-center pt-1">
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" formControlName="isActive" class="sr-only peer" />
            <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:right-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>
            <span class="mr-3 text-sm font-medium text-slate-700">تفعيل المنتج</span>
          </label>
        </div>

      </div>

      <!-- Modal Footer -->
      <div class="flex items-center justify-end space-x-3 space-x-reverse pt-4 border-t border-slate-100">
        <button type="button" (click)="onClose()" class="px-5 py-2.5 rounded-xl border border-slate-300 text-slate-600 hover:bg-slate-50 font-medium transition-colors">
          إلغاء
        </button>
        <button type="submit" [disabled]="productForm.invalid" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-medium transition-colors">
          {{ productToEdit() ? 'تحديث' : 'حفظ' }}
        </button>
      </div>
    </form>

  </div>
</div>
