<div class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50 dir-rtl">
  <div class="bg-white rounded-2xl w-full max-w-xl p-6 shadow-xl space-y-4 max-h-[90vh] overflow-y-auto">
    
    <div class="flex justify-between items-center border-b pb-3">
      <h3 class="text-lg font-bold text-slate-800">إضافة حساب شركة جديد</h3>
      <button (click)="closeModal.emit()" class="text-slate-400 hover:text-slate-600">✕</button>
    </div>

    @if (errorMessage) {
      <div class="p-3 bg-red-50 text-red-600 rounded-xl text-sm border border-red-200">
        {{ errorMessage }}
      </div>
    }

    <form [formGroup]="companyForm" (ngSubmit)="onSubmit()" class="grid grid-cols-2 gap-4">
      
      <!-- اسم الشركة -->
      <div class="col-span-1">
        <label class="block text-xs font-bold text-slate-700 mb-1">اسم الشركة *</label>
        <input formControlName="name" type="text" placeholder="مثال: Nile Tech"
               class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500" />
      </div>

      <!-- المسؤول الرئيسي -->
      <div class="col-span-1">
        <label class="block text-xs font-bold text-slate-700 mb-1">الشخص المسؤول *</label>
        <input formControlName="contactPerson" type="text" placeholder="أحمد حسن"
               class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500" />
      </div>

      <!-- الهاتف -->
      <div class="col-span-1">
        <label class="block text-xs font-bold text-slate-700 mb-1">رقم الهاتف *</label>
        <input formControlName="phone" type="text" placeholder="01012345678"
               class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500" />
      </div>

      <!-- البريد الإلكتروني -->
      <div class="col-span-1">
        <label class="block text-xs font-bold text-slate-700 mb-1">البريد الإلكتروني</label>
        <input formControlName="email" type="email" placeholder="info@company.com"
               class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500" />
      </div>

      <!-- الحد الائتماني Credit Limit -->
      <div class="col-span-1">
        <label class="block text-xs font-bold text-slate-700 mb-1">الحد الائتماني (EGP) *</label>
        <input formControlName="creditLimit" type="number" min="0"
               class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500" />
      </div>

      <!-- الرقم الضريبي -->
      <div class="col-span-1">
        <label class="block text-xs font-bold text-slate-700 mb-1">الرقم الضريبي</label>
        <input formControlName="taxNumber" type="text" placeholder="TAX-10001"
               class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500" />
      </div>

      <!-- العقد -->
      <div class="col-span-2">
        <label class="block text-xs font-bold text-slate-700 mb-1">تفاصيل العقد والاتفاقية</label>
        <textarea formControlName="contractDetails" rows="2" class="w-full px-3 py-2 border rounded-xl text-sm"></textarea>
      </div>

      <div class="col-span-2 flex justify-end gap-2 pt-2 border-t">
        <button type="button" (click)="closeModal.emit()" class="px-4 py-2 border rounded-xl text-sm font-bold text-slate-600">إلغاء</button>
        <button type="submit" [disabled]="isSubmitting" class="px-5 py-2 bg-blue-600 text-white rounded-xl text-sm font-bold disabled:bg-slate-300">
          {{ isSubmitting ? 'جاري الحفظ...' : 'حفظ الشركة' }}
        </button>
      </div>

    </form>
  </div>
</div>
