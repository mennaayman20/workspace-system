<div class="p-4 sm:p-8 space-y-6 sm:space-y-8 dir-rtl max-w-7xl mx-auto">
  
  <!-- Header Section -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b border-slate-200 pb-5">
    <div class="flex items-center gap-4">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-700 text-white flex items-center justify-center shadow-lg shadow-blue-500/20 shrink-0">
        <lucide-icon [img]="BuildingIcon" class="w-6 h-6"></lucide-icon>
      </div>
      <div>
        <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight">إدارة الشركات</h1>
        <p class="text-sm text-slate-500 mt-1">عرض وإضافة وتعديل بيانات الشركات المربوطة بالسستم</p>
      </div>
    </div>

<button type="button" 
          (click)="openAddModal()"
          class="group inline-flex items-center justify-center gap-2 px-5 py-3 bg-gradient-to-r from-blue-500 to-blue-700 text-white rounded-xl text-sm font-bold shadow-lg shadow-blue-500/25 hover:shadow-blue-500/40 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200">
    <lucide-icon [img]="PlusIcon" class="w-4 h-4 transition-transform duration-200 group-hover:rotate-90"></lucide-icon>
    <span>إضافة شركة جديدة</span>
  </button>
  </div>

  <!-- Search Bar -->
  <!-- <div class="flex flex-wrap items-center justify-between gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-200">
    <div class="w-full sm:w-80">
      <input #searchInput type="text" 
             (input)="onSearch(searchInput.value)" 
             placeholder="ابحث باسم الشركة أو رقم الهاتف..."
             class="w-full px-4 py-2 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white" />
    </div>
  </div> -->

  <!-- Loading & Error States -->
  @if (isLoading()) {
    <div class="text-center py-12 text-slate-500">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent"></div>
      <p class="mt-2 text-sm">جاري تحميل البيانات...</p>
    </div>
  }

  @if (errorMessage()) {
    <div class="p-4 bg-red-50 border border-red-200 rounded-2xl text-red-600 text-sm">
      {{ errorMessage() }}
    </div>
  }

<app-data-table
  [value]="companies()"
  [columns]="columns"
  [actions]="actions"
  [loading]="isLoading()"
  [searchable]="true"
    [columnFilters]="true"
  searchPlaceholder="ابحث باسم الشركة أو رقم الهاتف..."
  emptyTitle="لا توجد شركات مضافة حتى الآن"
  (action)="onAction($event)">

  <button tableEmptyAction type="button" (click)="openAddModal()"
    class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-bold transition-colors">
    + أضف أول شركة
  </button>
</app-data-table>

  <!-- Modal Call -->
  @if (isModalOpen()) {
    <app-add-company-modal
      [companyToEdit]="editingCompany()"
      (closeModal)="closeModal()"
      (companySaved)="refreshAfterSave()">
    </app-add-company-modal>
  }
@if (pendingDelete(); as d) {
  <div appPortal dir="rtl"
   class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4"
       (click)="cancelDelete()">
    <div class="w-full max-w-sm bg-white rounded-3xl p-6 shadow-2xl" dir="rtl"
         role="alertdialog" aria-modal="true" (click)="$event.stopPropagation()">

      <div class="flex items-start gap-3">
        <div class="w-11 h-11 rounded-2xl bg-red-50 text-red-500 flex items-center justify-center shrink-0">
          <lucide-icon [img]="TrashIcon" class="w-5 h-5"></lucide-icon>
        </div>
        <div>
          <h3 class="text-lg font-bold text-slate-900">حذف الشركة</h3>
          <p class="text-sm text-slate-500 mt-1.5 leading-relaxed">
            هل أنت متأكد من حذف
            <b class="text-slate-800">"{{ d.name || d.nameAr || d.nameEn }}"</b>؟
            <!-- يمكنك استعادتها لاحقاً. -->
          </p>
        </div>
      </div>

      <div class="flex gap-3 mt-6">
        <button type="button" (click)="confirmDelete()" [disabled]="isDeleting()"
                class="flex-1 py-2.5 bg-red-600 hover:bg-red-700 disabled:opacity-60 text-white rounded-xl text-sm font-bold transition-colors">
          {{ isDeleting() ? 'جاري الحذف...' : 'نعم، حذف' }}
        </button>
        <button type="button" (click)="cancelDelete()" [disabled]="isDeleting()"
                class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 disabled:opacity-60 rounded-xl text-sm font-bold text-slate-700 transition-colors">
          إلغاء
        </button>
      </div>
    </div>
  </div>
}
</div>
