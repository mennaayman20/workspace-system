@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm dir-rtl">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-xl w-full max-w-2xl overflow-hidden animate-in fade-in zoom-in duration-150">
      
      <!-- Header -->
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
        <div>
          <h2 class="text-base font-bold text-slate-800">حجز جديد / دخول عميل (Check-in)</h2>
          <p class="text-[11px] text-slate-500">اختر العميل والمساحة المناسبة مع تحديد وقت الحضور</p>
        </div>
        <button (click)="onClose()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
      </div>

      <!-- Form Body -->
      <form [formGroup]="bookingForm" (ngSubmit)="onSubmit()" class="p-6 space-y-5 max-h-[80vh] overflow-y-auto">
        
        <!-- Toggle Customer Mode -->
        <div class="p-3 bg-blue-50/60 rounded-xl border border-blue-100 flex items-center justify-between">
          <span class="text-xs font-bold text-blue-900">نوع العميل:</span>
          <div class="flex items-center gap-4 text-xs font-medium">
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="radio" [value]="false" formControlName="isNewCustomer" class="accent-blue-600" />
              <span>عميل مسجل سابقاً</span>
            </label>
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="radio" [value]="true" formControlName="isNewCustomer" class="accent-blue-600" />
              <span>+ عميل جديد</span>
            </label>
          </div>
        </div>

        <!-- Section 1: Customer Selection -->
        @if (!isNewCustomerMode) {
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">اختر العميل <span class="text-rose-500">*</span></label>
            <div class="space-y-2">
              <input 
                type="text" 
                placeholder="بحث بالاسم أو رقم الهاتف..." 
                (input)="onSearchCustomer($event)"
                class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:outline-none"
              />
              <select 
                formControlName="customerId"
                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:border-blue-500 focus:outline-none">
                <option value="" disabled>-- اختر العميل من القائمة --</option>
                @for (cust of filteredCustomers; track cust.id) {
                  <option [value]="cust.id">{{ cust.fullName }} ({{ cust.mobileNumber }})</option>
                }
              </select>
            </div>
          </div>
        } @else {
          <!-- Section 1.B: New Customer Form -->
          <div formGroupName="newCustomer" class="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
            <h3 class="text-xs font-bold text-slate-800 border-b pb-2">بيانات العميل الجديد</h3>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">اسم العميل <span class="text-rose-500">*</span></label>
                <input type="text" formControlName="fullName" placeholder="الاسم ثلاثي" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs" />
              </div>

              <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">رقم الهاتف <span class="text-rose-500">*</span></label>
                <input type="text" formControlName="mobileNumber" placeholder="01XXXXXXXXX" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs" />
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">الشركة (اختياري)</label>
                <input type="text" formControlName="company" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs" />
              </div>

              <div>
                <label class="block text-[11px] font-bold text-slate-600 mb-1">تصنيف العميل</label>
                <select formControlName="customerType" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs">
                  <option value="Individual">فردي (Individual)</option>
                  <option value="Corporate">شركات (Corporate)</option>
                </select>
              </div>
            </div>
          </div>
        }

        <!-- Section 2: Workspace & Booking Options -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">اختيار المساحة (Workspace) <span class="text-rose-500">*</span></label>
            <select formControlName="workspaceId" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white focus:border-blue-500 focus:outline-none">
              <option value="" disabled>-- اختر القاعة أو المكتب --</option>
              @for (ws of workspaces; track ws.id) {
                <option [value]="ws.id" [disabled]="ws.status !== 'Available'">
                  {{ ws.name }} - ({{ ws.type }}) {{ ws.status !== 'Available' ? '[مشغولة]' : '' }}
                </option>
              }
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">عدد الأشخاص <span class="text-rose-500">*</span></label>
            <input type="number" formControlName="numberOfPeople" min="1" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:bg-white" />
          </div>
        </div>

        <!-- Timing -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">تاريخ الحجز <span class="text-rose-500">*</span></label>
            <input type="date" formControlName="bookingDate" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs" />
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">وقت البداية <span class="text-rose-500">*</span></label>
            <input type="time" formControlName="startTime" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs" />
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">المغادرة المتوقعة</label>
            <input type="time" formControlName="expectedEndTime" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs" />
          </div>
        </div>

        <!-- Actions Direct Check-in -->
        <div class="flex items-center gap-2 pt-2">
          <input type="checkbox" id="checkIn" formControlName="isDirectCheckIn" class="w-4 h-4 accent-blue-600 rounded" />
          <label for="checkIn" class="text-xs font-bold text-slate-700 cursor-pointer">بدء الجلسة فوراً الان (Check-in المباشر)</label>
        </div>

        <!-- Notes -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">ملاحظات إضافية</label>
          <textarea formControlName="notes" rows="2" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs resize-none"></textarea>
        </div>

        <!-- Footer Actions -->
        <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
          <button type="button" (click)="onClose()" class="px-4 py-2.5 rounded-xl border border-slate-200 text-xs text-slate-600 hover:bg-slate-50">إلغاء</button>
          <button type="submit" [disabled]="isSubmitting" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold disabled:opacity-50">
            {{ isSubmitting ? 'جاري الحفظ...' : 'تأكيد وتنسيق الحجز' }}
          </button>
        </div>

      </form>
    </div>
  </div>
}
