<aside class="w-64 h-[calc(100vh-4rem)] bg-white border-l border-slate-200 flex flex-col justify-between p-4 sticky top-16 select-none">
  
  <!-- Top Section: Navigation Links -->
  <div class="space-y-6">
    
    <!-- Workspace Switcher / Status -->
    <div class="p-3 bg-slate-50 border border-slate-200/80 rounded-2xl flex items-center justify-between cursor-pointer hover:border-blue-200 transition-colors">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-sm shadow-sm">
          HQ
        </div>
        <div class="flex flex-col">
          <span class="text-xs font-bold text-slate-800 leading-tight">الفرع الرئيسي</span>
          <span class="text-[10px] text-slate-500">بني سويف - الاباصيري</span>
        </div>
      </div>
      <span class="text-xs text-slate-400">⇅</span>
    </div>

    <!-- Main Navigation Menu -->
    <nav class="space-y-1">
      <p class="px-3 text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">القائمة الرئيسية</p>

      <!-- Dynamic Navigation Links -->
      <a 
        *ngFor="let item of navItems"
        [routerLink]="item.route"
        routerLinkActive="bg-blue-50 text-blue-700 font-bold border-blue-100"
        [routerLinkActiveOptions]="{ exact: false }"
        class="flex items-center justify-between px-3.5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-50 hover:text-slate-900 font-medium text-xs border border-transparent transition-all"
      >
        <div class="flex items-center gap-3">
      
          <span>{{ item.label }}</span>
        </div>

        <!-- Reusable Badge Component -->
        @if (item.badge) {
          <app-badge 
            [variant]="item.badge.variant" 
            [size]="item.badge.variant === 'slate' ? 'md' : 'sm'"
          >
            {{ item.badge.text }}
          </app-badge>
        }
      </a>
    </nav>

  </div>

  <!-- Bottom Section: Settings & System Status -->
  <div class="space-y-3 pt-4 border-t border-slate-100">
    <a 
      routerLink="settings"
      routerLinkActive="bg-blue-50 text-blue-700 font-bold border-blue-100"
      class="flex items-center gap-3 px-3.5 py-2 rounded-xl text-slate-600 hover:bg-slate-50 hover:text-slate-900 font-medium text-xs border border-transparent transition-all"
    >
      <span class="text-base">⚙️</span>
      <span>إعدادات النظام</span>
    </a>

    <!-- System Help / Support Card -->
    <div class="p-3 bg-gradient-to-br from-slate-900 to-blue-950 text-white rounded-2xl flex flex-col gap-2">
      <div class="flex items-center justify-between">
        <span class="text-xs font-bold text-blue-200">الدعم الفني</span>
      </div>
      <p class="text-[11px] text-slate-300 leading-relaxed">هل واجهتك مشكلة أثناء تنظيم الحجوزات؟</p>
      
      <!-- Reusable Button Component -->
      <app-button 
        variant="primary" 
        size="sm" 
        [fullWidth]="true"
        (onClick)="onContactSupport()"
      >
        تواصل معنا
      </app-button>
    </div>
  </div>

</aside>
