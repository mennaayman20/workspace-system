<aside class="w-64 h-[calc(100vh-4rem)] bg-white/90 backdrop-blur-md border-l border-slate-200/80 flex flex-col justify-between p-4 sticky top-16 select-none shrink-0">
  
  <!-- القسم العلوي: محول الفرع والقائمة الرئيسية -->
  <div class="space-y-6">
    
    <!-- محول الفرع (Workspace Switcher) -->
    <div 
      matRipple 
      [matRippleColor]="'rgba(0, 0, 0, 0.04)'"
      class="p-3 bg-slate-50/80 hover:bg-slate-100/70 border border-slate-200/80 rounded-2xl flex items-center justify-between cursor-pointer transition-all duration-300 ease-out group shadow-2xs">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center font-black text-xs shadow-md shadow-blue-500/15 shrink-0 transition-transform duration-300 group-hover:scale-105">
          HQ
        </div>
        <div class="flex flex-col min-w-0">
          <span class="text-xs font-bold text-slate-900 leading-tight truncate">الفرع الرئيسي</span>
          <span class="text-[10px] font-medium text-slate-500 truncate mt-0.5">بني سويف - الإباصيري</span>
        </div>
      </div>
    </div>

    <!-- القائمة الرئيسية (Main Navigation) -->
    <nav class="space-y-1.5">
      <p class="px-3 text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-2.5">القائمة الرئيسية</p>

      <!-- الروابط الديناميكية -->
      <a 
        *ngFor="let item of navItems"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        matRipple
        [matRippleColor]="'rgba(255, 255, 255, 0.25)'"
        class="nav-link flex items-center justify-between px-3.5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100/70 hover:text-slate-900 font-semibold text-sm border border-transparent"
      >
        <div class="flex items-center gap-3 min-w-0">
          <!-- <mat-icon 
            *ngIf="item.icon" 
            class="!w-5 !h-5 !text-lg text-slate-400 group-hover:text-slate-700 shrink-0 flex items-center justify-center">
            {{ item.icon }}
          </mat-icon> -->
          <span class="truncate">{{ item.label }}</span>
        </div>

        <!-- الشارة (Badge) -->
        @if (item.badge) {
          <app-badge 
            [variant]="'slate'" 
            [size]="item.badge.variant === 'slate' ? 'md' : 'sm'">
            {{ item.badge.text }}
          </app-badge>
        }
      </a>
    </nav>

  </div>

  <!-- القسم السفلي: إعدادات النظام والدعم الفني -->
  <div class="space-y-3 pt-4 border-t border-slate-100">
    <a 
      routerLink="settings"
      routerLinkActive="active"
      matRipple
      [matRippleColor]="'rgba(255, 255, 255, 0.25)'"
      class="nav-link flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100/70 hover:text-slate-900 font-semibold text-xs border border-transparent"
    >

      <span>إعدادات النظام</span>
    </a>


  </div>

</aside>
