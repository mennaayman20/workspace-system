<aside class="w-70 h-[calc(100vh-4rem)] bg-white/90 backdrop-blur-md border-l border-slate-200/80 flex flex-col justify-between p-4 sticky top-16 select-none shrink-0 overflow-y-auto">

  <div class="space-y-6">

    <!-- محول الفرع -->
    <div
      matRipple
      [matRippleColor]="'rgba(0, 0, 0, 0.04)'"
      class="p-3 bg-slate-50/80 hover:bg-slate-100/70 border border-slate-200/80 rounded-2xl flex items-center justify-between cursor-pointer transition-all duration-300 ease-out group shadow-2xs">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center font-black text-xs shadow-md shadow-blue-500/15 shrink-0 transition-transform duration-300 group-hover:scale-105">
          HQ
        </div>
        <div class="flex flex-col min-w-0">
          <span class="text-xs font-bold text-slate-900 leading-tight truncate">الفرع الرئيسي</span>
          <span class="text-[10px] font-medium text-slate-500 truncate mt-0.5">بني سويف - الإباصيري</span>
        </div>
      </div>
    </div>

    <!-- القائمة الرئيسية -->
    <nav class="space-y-1.5">
      <p class="px-3 text-[10px] font-extrabold text-slate-400 uppercase tracking-wider mb-2.5">القائمة الرئيسية</p>

      @for (item of mainItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          matRipple
          [matRippleColor]="'rgba(255, 255, 255, 0.25)'"
          class="nav-link flex items-center justify-between px-3.5 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100/70 hover:text-slate-900 font-semibold text-sm border border-transparent">
          <div class="flex items-center gap-3 min-w-0">
            <mat-icon class="!w-5 !h-5 !text-[20px] shrink-0">{{ item.icon }}</mat-icon>
            <span class="truncate">{{ item.label }}</span>
          </div>
          @if (item.badge) {
            <app-badge [variant]="'slate'" [size]="item.badge.variant === 'slate' ? 'md' : 'sm'">
              {{ item.badge.text }}
            </app-badge>
          }
        </a>
      }
    </nav>

    <!-- الإعدادات العامة (جروب قابل للطي) -->
    <div>
      <!-- عنوان القسم بخط جانبي -->
      <div class="flex items-center gap-3 px-1 mb-3">
        <span class="text-[11px] font-extrabold text-slate-500 whitespace-nowrap">الإعدادات العامة</span>
        <span class="h-px flex-1 bg-slate-200"></span>
      </div>

      <div class="rounded-2xl border border-slate-200/80 bg-white p-1.5">

        <!-- رأس الجروب -->
        <button
          type="button"
          (click)="toggleSettings()"
          [attr.aria-expanded]="settingsOpen()"
          class="w-full flex items-center justify-between gap-3 px-3 py-2.5 rounded-xl text-blue-600 hover:bg-blue-50/60 transition-colors font-semibold text-sm">
          <div class="flex items-center gap-3 min-w-0">
            <mat-icon class="!w-5 !h-5 !text-[20px] shrink-0">tune</mat-icon>
            <span class="truncate">الإعدادات الأساسية</span>
          </div>
          <span class="w-6 h-6 rounded-full bg-blue-50 flex items-center justify-center shrink-0">
            <mat-icon
              class="!w-4 !h-4 !text-[16px] transition-transform duration-300"
              [class.rotate-180]="settingsOpen()">
              expand_more
            </mat-icon>
          </span>
        </button>

        <!-- المحتوى (أنيميشن فتح/قفل) -->
        <div
          class="grid transition-[grid-template-rows] duration-300 ease-out"
          [class.grid-rows-[1fr]]="settingsOpen()"
          [class.grid-rows-[0fr]]="!settingsOpen()">
          <div class="overflow-hidden">
            <!-- ms/ps/border-s = logical properties، فتشتغل صح مع RTL -->
            <div class="mt-1 ms-5 ps-2 border-s border-slate-200 space-y-0.5">
              @for (item of settingsItems; track item.route) {
                <a
                  [routerLink]="item.route"
                  routerLinkActive="!bg-blue-50 !text-blue-600"
                  [routerLinkActiveOptions]="{ exact: false }"
                  matRipple
                  [matRippleColor]="'rgba(37, 99, 235, 0.08)'"
                  class="flex items-center gap-3 px-3 py-2 rounded-xl text-slate-600 hover:bg-slate-100/70 hover:text-slate-900 font-semibold text-[13px] transition-colors">
                  <mat-icon class="!w-[18px] !h-[18px] !text-[18px] shrink-0">{{ item.icon }}</mat-icon>
                  <span class="truncate">{{ item.label }}</span>
                </a>
              }
            </div>
          </div>
        </div>

      </div>
    </div>

  </div>

  <!-- القسم السفلي -->
  <!-- <div class="space-y-3 pt-4 mt-4 border-t border-slate-100">
    <a
      routerLink="settings"
      routerLinkActive="active"
      matRipple
      [matRippleColor]="'rgba(255, 255, 255, 0.25)'"

      <span>إعدادات النظام</span>
    </a>
  </div> -->

</aside>
