<header class="sticky top-0 z-50 w-full bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm px-4 lg:px-10 h-16 flex items-center select-none">
  <div class="w-full max-w-8xl mx-auto flex items-center justify-between gap-5">
    
    <!-- Left Section: Brand & Quick Action -->
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2.5 font-extrabold text-xl text-slate-900 cursor-pointer group">
        
        <span class="tracking-tight">WorkSpace</span>
      </div>

      <!-- Reusable Secondary Button for Quick Check-in -->
      <app-button 
        variant="secondary" 
        size="sm" 
        (onClick)="openCheckInModal()"
        class="hidden sm:block"
      >
        <span>Check-in سريع</span>
      </app-button>
    </div>

    <!-- Center Section: Quick Global Search via Reusable Input -->
    <div class="hidden md:block flex-1 max-w-md">
      <app-input
       
        placeholder="ابحث عن عميل، مساحة عمل، أو حجز... (Ctrl + K)"
        [ngModel]="searchQuery()"
        (ngModelChange)="onSearch($event)"
      ></app-input>
    </div>

    <!-- Right Section: Indicators & User Profile -->
    <div class="flex items-center gap-3">
      
      <!-- Active Sessions Status Indicator -->
      <div class="flex items-center gap-2 bg-emerald-50/80 border border-emerald-200/80 px-3 py-1.5 rounded-full text-xs text-emerald-700 shadow-sm">
        <span class="pulse-dot"></span>
        <span class="font-medium text-[11px]">الجلسات:</span>
        <strong class="font-bold text-xs">{{ activeSessionsCount() }}</strong>
      </div>

      <!-- Reusable Outline Button for Language Switcher -->
      <app-button 
        variant="outline" 
        size="sm" 
        (onClick)="toggleLanguage()"
      >
        <span>{{ currentLang() }}</span>
      </app-button>

      <!-- Notifications -->
      <button class="relative w-9 h-9 flex items-center justify-center bg-slate-50 border border-slate-200 rounded-xl text-slate-600 hover:bg-blue-50 hover:border-blue-200 hover:text-blue-700 transition-all cursor-pointer">
        <span class="text-sm">🔔</span>
        @if (unreadNotifications() > 0) {
          <span class="absolute -top-1 -left-1">
            <app-badge variant="rose" size="sm">
              {{ unreadNotifications() }}
            </app-badge>
          </span>
        }
      </button>

      <!-- User Profile -->
      <div class="flex items-center gap-2.5 p-1.5 rounded-xl hover:bg-slate-100/70 cursor-pointer transition-colors border border-transparent hover:border-slate-200">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-600 to-sky-600 text-white flex items-center justify-center font-bold text-xs shadow-sm">
          <span>{{ currentUser().initials }}</span>
        </div>
        <div class="hidden sm:flex flex-col text-right">
          <span class="text-xs font-bold text-slate-800 leading-tight">{{ currentUser().name }}</span>
          <span class="text-[10px] font-medium text-slate-500">{{ currentUser().role }}</span>
        </div>
        <span class="text-[10px] text-slate-400">▾</span>
      </div>

    </div>

  </div>
</header>

<!-- Reusable Quick Check-in Modal -->
<app-modal 
  [isOpen]="isCheckInModalOpen()" 
  title="تسجيل دخول سريع (Quick Check-in)"
  (onClose)="closeCheckInModal()"
>
  <div class="space-y-4">
    <app-input label="رقم الهاتف أو اسم العميل" placeholder="أدخل رقم الهاتف للبحث السريع..." icon="📞"></app-input>
    <app-input label="اختر مساحة العمل" placeholder="اختر الغرفة أو الميزانين..." icon="🚪"></app-input>
  </div>

  <div modal-footer class="flex gap-2">
    <app-button variant="outline" (onClick)="closeCheckInModal()">إلغاء</app-button>
    <app-button variant="primary" (onClick)="closeCheckInModal()">تأكيد الدخول</app-button>
  </div>
</app-modal>
