<header class="sticky top-0 z-50 w-full bg-white/80 backdrop-blur-xl border-b border-slate-200/60 shadow-xs px-4 lg:px-8 h-16 flex items-center select-none transition-all duration-300">
  <div class="w-full max-w-screen-2xl mx-auto flex items-center justify-between gap-6">

    <!-- Left Section: Brand & Quick Action -->
    <div class="flex items-center gap-6">
      <!-- Logo -->
      <div class="flex items-center gap-3 cursor-pointer group">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-sky-500 flex items-center justify-center text-white shadow-md shadow-blue-500/20 group-hover:scale-105 transition-all duration-300">
          <span class="font-black text-lg tracking-wider">W</span>
        </div>
        <div class="flex flex-col">
          <span class="font-bold text-lg text-slate-900 tracking-tight leading-none group-hover:text-blue-600 transition-colors">WorkSpace</span>
          <span class="text-[10px] font-semibold text-slate-400 tracking-widest uppercase mt-1">Platform</span>
        </div>
      </div>

      <!-- Quick Action Button -->
      <app-button
        variant="secondary"
        size="sm"
        (onClick)="openCheckInModal()"
        class="hidden sm:inline-flex items-center bg-slate-100 hover:bg-blue-50 text-slate-700 hover:text-blue-600 font-semibold text-xs px-4 py-2 rounded-xl border border-slate-200/80 hover:border-blue-200 transition-all duration-200 active:scale-95 cursor-pointer"
      >
        <span>تسجيل دخول سريع</span>
      </app-button>
    </div>

    <!-- Center Section: Global Search -->
    <div class="hidden md:block flex-1 max-w-md">
      <div class="relative group">
        <app-input
          placeholder="بحث سريع عن المقاعد، الغرف، أو الأعضاء..."
          [ngModel]="searchQuery()"
          (ngModelChange)="onSearch($event)"
          class="w-full bg-slate-50/80 hover:bg-slate-100/80 focus-within:bg-white border-slate-200/80 rounded-xl text-xs transition-all duration-200"
        ></app-input>
      </div>
    </div>

    <!-- Right Section: Indicators & User Profile -->
    <div class="flex items-center gap-3">

      <!-- Active Sessions Pill -->
      <div class="hidden sm:flex items-center gap-2 bg-emerald-50 border border-emerald-200/60 px-3 py-1.5 rounded-xl text-xs text-emerald-800">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
        </span>
        <span class="font-medium text-[11px] text-slate-600">الجلسات النشطة:</span>
        <span class="font-bold text-xs px-1.5 py-0.5 bg-emerald-600 text-white rounded-md">{{ activeSessionsCount() }}</span>
      </div>

      <div class="h-5 w-[1px] bg-slate-200 mx-1 hidden sm:block"></div>



 

      <!-- User Profile -->
      <div class="flex items-center gap-3 p-1.5 px-2.5 rounded-xl hover:bg-slate-100/80 cursor-pointer transition-all duration-200 border border-transparent hover:border-slate-200/80 group">
        <div class="relative">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-500 text-white flex items-center justify-center font-bold text-xs shadow-sm">
            <span>{{ currentUser().initials }}</span>
          </div>
          <span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-emerald-500 border-2 border-white rounded-full"></span>
        </div>
        <div class="hidden sm:flex flex-col text-start">
          <span class="text-xs font-bold text-slate-800 group-hover:text-blue-600 transition-colors leading-tight">{{ currentUser().name }}</span>
          <span class="text-[10px] font-medium text-slate-400 mt-0.5">{{ currentUser().role }}</span>
        </div>
      </div>

    </div>
  </div>
</header>

<!-- Quick Check-in Modal -->
<app-modal
  [isOpen]="isCheckInModalOpen()"
  title="تسجيل دخول سريع"
  (onClose)="closeCheckInModal()"
  class="backdrop-blur-md"
>
  <div class="p-2 space-y-4">
    <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-3.5">
      <p class="text-xs text-slate-600 leading-relaxed font-medium">
        قم بتسجيل الدخول السريع عن طريق أدخال رقم الهاتف وتحديد الغرفة أو المساحة المطلوبة.
      </p>
    </div>

    <div class="space-y-3">
      <app-input
        label="رقم الهاتف"
        placeholder="مثال: 05X XXX XXXX"
        [ngModel]="checkInPhone()"
        (ngModelChange)="checkInPhone.set($event)"
        class="focus-within:ring-2 focus-within:ring-blue-500/20 rounded-xl"
      ></app-input>

      <app-input
        label="المساحة / الغرفة"
        placeholder="اختر أو اكتب اسم المساحة..."
        [ngModel]="checkInSpace()"
        (ngModelChange)="checkInSpace.set($event)"
        class="focus-within:ring-2 focus-within:ring-blue-500/20 rounded-xl"
      ></app-input>
    </div>
  </div>

  <div modal-footer class="flex items-center justify-end gap-2.5 pt-3 border-t border-slate-100">
    <app-button 
      variant="outline" 
      (onClick)="closeCheckInModal()"
      class="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 font-semibold text-xs transition-all cursor-pointer"
    >
      إلغاء
    </app-button>
    <app-button 
      variant="primary" 
      (onClick)="confirmCheckIn()"
      class="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs shadow-sm active:scale-95 transition-all cursor-pointer"
    >
      تأكيد الدخول
    </app-button>
  </div>
</app-modal>
